name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PENUMBRA_VERSION_CODE: ${{ github.run_number }}
      PENUMBRA_VERSION_NAME: 0.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleDebug assembleRelease 2>&1 | tee build.log

      - name: Report build errors as annotations
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong|FAILED|Could not|AAPT|Execution failed|> " build.log \
            | head -80 | while IFS= read -r line; do echo "::error::${line}"; done

      - name: Collect APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/Penumbra-nightly.apk
          cp app/build/outputs/apk/debug/app-debug.apk out/Penumbra-nightly-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: penumbra-apk
          path: out/*.apk

      - name: Publish nightly release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --yes --cleanup-tag || true
          gh release create nightly out/Penumbra-nightly.apk out/Penumbra-nightly-debug.apk \
            --prerelease --title "Nightly build ${PENUMBRA_VERSION_NAME}" \
            --notes "Automatic build of the latest code (commit ${GITHUB_SHA::7}).

          Install **Penumbra-nightly.apk** on any Android 10+ phone or tablet. Nightly builds are signed with a public test key, so each new nightly installs over the previous one and keeps your drawings."
